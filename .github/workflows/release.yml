name: Python release

# Manual only. With publish=false (the default) this rebuilds and inspects the
# committed candidate and uploads nothing. With publish=true it uploads exactly
# the inspected wheel and sdist to the maintainer-selected index, and only when
# HEAD carries python-v<version>. See docs/releases.md before dispatching.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the inspected wheel and sdist (false: build and inspect only)"
        type: boolean
        default: false
      repository_url:
        description: "Upload index URL (required to publish; public PyPI or a private index)"
        type: string
        default: ""

jobs:
  python-release:
    name: Python release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build tools
        run: python -m pip install build twine pytest
      - name: Build committed candidate
        run: python scripts/prepare_release.py --output /tmp/ccfoundry-release
      - name: Verify archives and fresh installations
        env:
          CCFOUNDRY_RELEASE_ARTIFACTS: /tmp/ccfoundry-release
        run: python -m pytest tests/test_release_artifacts.py -q
      - name: Record candidate manifest
        run: cat /tmp/ccfoundry-release/release-manifest.json
      - name: Upload inspected Python artifacts
        env:
          PUBLISH: ${{ inputs.publish }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
          TWINE_USERNAME: ${{ secrets.PYTHON_INDEX_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYTHON_INDEX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo "publish=false: candidate built and inspected; nothing uploaded."
            exit 0
          fi
          if [ -z "$TWINE_USERNAME" ] || [ -z "$TWINE_PASSWORD" ]; then
            echo "PYTHON_INDEX_USERNAME / PYTHON_INDEX_TOKEN secrets are not configured; nothing uploaded." >&2
            exit 1
          fi
          files="$(python scripts/release_publish_guard.py \
            --candidate /tmp/ccfoundry-release \
            --repository-url "$REPOSITORY_URL")"
          mapfile -t artifacts <<< "$files"
          python -m twine upload --non-interactive --repository-url "$REPOSITORY_URL" "${artifacts[@]}"
