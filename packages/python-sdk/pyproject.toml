[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccfoundry-agent-kit"
dynamic = ["version"]
description = "Open-source agent-side SDK for building CoChiper Foundry-compatible agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.9,<5.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "httpx2>=2.5,<3.0",
  "jsonschema>=4.20,<5.0",
  "mcp>=2.2,<2.3",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pyyaml>=6.0,<7.0",
]

[project.urls]
Documentation = "https://github.com/ic-star-tech/ccfoundry-agent-kit/blob/main/docs/sdk.md"
Source = "https://github.com/ic-star-tech/ccfoundry-agent-kit"
Issues = "https://github.com/ic-star-tech/ccfoundry-agent-kit/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "ccfoundry_agent_kit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
